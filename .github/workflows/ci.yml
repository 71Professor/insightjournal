name: Moodle Plugin CI

# R4-10: restricting the push trigger to main + version tags (rather than
# every branch) avoids a duplicate run whenever a feature/PR branch is
# pushed - previously that fired both a `push`-event run and a
# `pull_request`-event run for the identical commit. `main` is still
# covered for direct pushes/merges, and `tags: ['v*']` is still covered
# because release.yml's `workflow_run` trigger specifically needs a
# push-triggered CI run for the tag itself (see release.yml's own
# comments); `pull_request` stays unrestricted so every PR, from any
# branch or fork, still gets CI.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: 'ubuntu-latest'

    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:10' || '' }}
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            moodle-branch: 'main'
            database: 'pgsql'
          - php: '8.3'
            moodle-branch: 'MOODLE_502_STABLE'
            database: 'mariadb'
          - php: '8.2'
            moodle-branch: 'MOODLE_501_STABLE'
            database: 'pgsql'
          - php: '8.2'
            moodle-branch: 'MOODLE_500_STABLE'
            database: 'mariadb'
          - php: '8.1'
            moodle-branch: 'MOODLE_405_STABLE'
            database: 'pgsql'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          # If you are not using code coverage, keep "none". Otherwise, use "pcov" (Moodle 3.10 and up) or "xdebug".
          # If you try to use code coverage with "none", it will fallback to phpdbg (which has known problems).
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          # Uncomment this to run Behat tests using the Moodle App.
          # MOODLE_APP: 'true'

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() && matrix.php >= '8.2' }}
        # Squiz.Functions.MultiLineFunctionDeclaration.SpaceAfterFunction demands a
        # space after `function` in AMD JS, which directly contradicts ESLint's
        # space-before-function-paren rule (enforced by the Grunt step below with
        # --max-lint-warnings 0), which forbids that same space. Previously excluded
        # here repo-wide via --exclude (which only accepts 3-part Standard.Category.Sniff
        # codes, disabling the whole sniff everywhere); now scoped to just the two AMD
        # files that actually need it via inline `// phpcs:disable`/`// phpcs:enable`
        # comments, so this sniff still protects every other file in the plugin.
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: PHPStan
        if: ${{ !cancelled() && matrix.moodle-branch == 'MOODLE_500_STABLE' }}
        # Not a moodle-plugin-ci command (it has none for PHPStan): runs
        # directly against the Moodle checkout moodle-plugin-ci's install
        # step already set up, using micaherne/phpstan-moodle to bridge in
        # the frankenstyle autoloader/core globals. One representative
        # branch only (not the full matrix), per R2-07 - it needs its own
        # composer install, and the plugin's own code doesn't vary by
        # Moodle branch in a way that would change its analysis result.
        # No phpstan-baseline.neon exists (R4-07 removed it - every finding
        # is resolved at its source instead), so this step has nothing to
        # regenerate; a real finding here fails the build.
        # Version pinned exactly (R3-11): an unpinned require would silently
        # pick up whatever release is newest on the day CI happens to run,
        # so a breaking change upstream could turn this step red with no
        # corresponding change in this repo. Bump deliberately when needed.
        run: |
          cd moodle
          composer require --dev --no-interaction micaherne/phpstan-moodle:1.1.0
          vendor/bin/phpstan analyse -c mod/insightjournal/phpstan.neon --memory-limit=1G --no-progress

      - name: PHPStan (tests)
        if: ${{ !cancelled() && matrix.moodle-branch == 'MOODLE_500_STABLE' }}
        # R4-07: tests/ is now analysed too, but as its own tolerant,
        # non-gating job rather than folded into the strict step above or
        # given a baseline - advanced_testcase and the generator classes
        # are only fully resolvable inside PHPUnit's own bootstrap, which
        # this plain phpstan-moodle bridge doesn't load, so this currently
        # reports ~300 findings that are almost all PHPUnit/Moodle
        # test-framework noise, not real issues in this plugin's tests. See
        # phpstan-tests.neon for the full rationale. continue-on-error
        # means this step's own failure is visible in the run summary
        # without turning the job (or this leg's overall conclusion) red.
        continue-on-error: true
        run: |
          cd moodle
          vendor/bin/phpstan analyse -c mod/insightjournal/phpstan-tests.neon --memory-limit=1G --no-progress

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome --scss-deprecations

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1
