name: Release

# Builds an installable plugin ZIP whose root folder is named
# "insightjournal" (as required by the Moodle plugin installer) and
# attaches it to a GitHub Release.
#
# Triggered once the "Moodle Plugin CI" workflow *completes* for a tag push
# (ci.yml's `on: [push, pull_request]` already runs for tag pushes too),
# not directly by the tag push itself - so a red CI run can never produce
# a release (R2-08; see the v0.5.0-beta incident this fixes: a tag was
# published ~7 minutes before its own CI run had finished, and had to be
# deleted and recreated after CI went red on a lint gate).
#
# For a workflow_run triggered by a tag-push run of the upstream workflow,
# head_branch holds the tag name itself (not a branch name) and head_sha is
# the exact commit that was tagged - both confirmed against this repo's own
# past tag runs (e.g. v0.6.0-beta's CI run has head_branch "v0.6.0-beta",
# head_sha matching the tagged commit exactly).
#
# R3-03 hardening: a bare `startsWith(head_branch, 'v')` check left two
# spoofing paths open. First, ci.yml's `on: [push, pull_request]` means a
# PR or branch merely named like a tag (e.g. "v9.9.9-evil") also produces a
# "Moodle Plugin CI" workflow_run whose head_branch starts with "v" - the
# added `event == 'push'` check rejects anything but an actual push (tag
# pushes included); `head_repository.full_name == github.repository`
# rejects a fork's workflow_run reaching this job at all. Second, even a
# genuine push-triggered run only proves some ref was pushed and CI'd - it
# never confirms a real git tag object exists and points at that exact
# commit. The "Verify the tag..." step below queries the remote directly
# (git ls-remote, no checkout needed) and fails closed if refs/tags/$TAG is
# missing or resolves to a different commit than head_sha - only then is
# that verified tag ref (not a bare SHA) checked out, so every later step
# operates on a commit provably reachable via a real tag, not merely a
# same-named branch or a tag that moved after CI ran.
on:
  workflow_run:
    workflows: ["Moodle Plugin CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    runs-on: 'ubuntu-latest'
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v')

    steps:
      - name: Verify the tag exists and resolves to the CI-validated commit
        run: |
          # Query both the tag ref and its peeled form in one call: a
          # lightweight tag returns one line (the commit SHA itself); an
          # annotated tag returns two (the tag object first, the peeled
          # commit SHA second, via the `^{}` suffix) - `tail -n1` always
          # picks the commit SHA either way. No local repo/checkout needed.
          resolved=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" \
            "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | awk '{print $1}' | tail -n1)

          if [ -z "${resolved}" ]; then
            echo "::error::No tag refs/tags/${TAG} exists on the remote - refusing to release from a branch or PR merely named like a tag."
            exit 1
          fi
          if [ "${resolved}" != "${HEAD_SHA}" ]; then
            echo "::error::Tag ${TAG} resolves to ${resolved}, but the CI run that triggered this release validated ${HEAD_SHA} - refusing to release a commit CI never tested (the tag may have moved after CI ran)."
            exit 1
          fi
          echo "Verified: refs/tags/${TAG} resolves to ${HEAD_SHA}, matching the CI-validated commit."
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Check out the verified tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ github.event.workflow_run.head_branch }}
          persist-credentials: false

      - name: Check tag matches version.php release
        run: |
          tag="${TAG#v}"
          release=$(sed -n "s/^\$plugin->release *= *'\(.*\)';.*/\1/p" version.php)
          echo "Tag: ${tag} / version.php release: ${release}"
          if [ "${tag}" != "${release}" ]; then
            echo "::error::Tag v${tag} does not match \$plugin->release '${release}' in version.php."
            exit 1
          fi
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}

      - name: Build plugin ZIP
        run: |
          git archive --format=zip --prefix=insightjournal/ \
            -o "mod_insightjournal-${TAG}.zip" HEAD
          unzip -l "mod_insightjournal-${TAG}.zip"
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          files: mod_insightjournal-${{ github.event.workflow_run.head_branch }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.event.workflow_run.head_branch, '-') }}
